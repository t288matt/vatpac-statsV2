name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements*.txt
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          if [ -f collector/requirements-dev.txt ]; then pip install -r collector/requirements-dev.txt; fi
          pip install ruff mypy
      - name: ruff
        run: cd collector && ruff check .
      - name: mypy
        run: cd collector && mypy src

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements*.txt
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          if [ -f collector/requirements-dev.txt ]; then pip install -r collector/requirements-dev.txt; fi
          pip install pytest
      - name: pytest (unit; integration tests need Docker and are marked)
        env:
          PYTHONPATH: collector/src
        run: pytest -q -m "not integration" tests collector/tests --ignore=tests/.venv

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

  size-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ops/check_size_budget.py

  fixture-pii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ops/check_fixture_pii.py tests/fixtures

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-build:
    runs-on: ubuntu-latest
    needs: [compose-config]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images (no push)
        run: |
          cp .env.example .env
          docker compose build
