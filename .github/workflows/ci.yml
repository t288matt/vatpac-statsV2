name: ci

on:
  push:
    branches: [main, dev]
    # A push always runs the FULL suite (the scope job below never narrows a push), so the main CI that release.yml and
    # ci-failure-issue read keeps its meaning (issue 290). Pushes that only touch prose skip this workflow, as before: order
    # matters, a later pattern overrides an earlier one, so the docs that tests read (and everything outside docs/) still run CI.
    # docs-secret-scan.yml still scans those prose pushes.
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - 'docs/RUNBOOKS/**'
      - 'docs/reference/**'
      - 'docs/CHART_DEFINITIONS.md'
      - 'docs/DATA_DICTIONARY.md'
      - 'docs/DEFINITIONS.md'
  pull_request:
    # No path filter (issue 290). The scope job classifies the changed paths (ops/ci_scope.py) and ci-result always reports, so
    # a required check never waits on a workflow that did not start. A prose-only pull request runs the secret scan only.
  workflow_call:  # reusable; release.yml no longer calls it (it checks the commit's main CI run instead, issue 173)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a run on main

env:
  RUFF_VERSION: "0.8.4"
  MYPY_VERSION: "1.14.1"

jobs:
  # How much of the suite this run needs: docs, dashboards or full (ops/ci_scope.py; rules and tests in tests/test_ci_scope.py).
  # Only a pull request can be narrowed, and only by an exact classification. A push, a failed diff, an unknown path, a mix, or
  # a change to .github/ or the script itself is full.
  scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify the changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=full
          if [ "$EVENT" = pull_request ] && git fetch --no-tags --depth=1 origin "$BASE_SHA" \
             && git diff -z --name-status -M "$BASE_SHA" HEAD > "$RUNNER_TEMP/changes.z"; then
            # Classify with the BASE branch's copy of the script, never the pull request's own, so a pull request cannot loosen
            # its own filter. A change to .github/ or to the script is forced to full here as well, independent of any Python.
            if grep -zqE '^(\.github/|ops/ci_scope\.py$)' "$RUNNER_TEMP/changes.z"; then
              scope=full
            elif git show "$BASE_SHA:ops/ci_scope.py" > "$RUNNER_TEMP/base_ci_scope.py"; then
              scope="$(python3 "$RUNNER_TEMP/base_ci_scope.py" < "$RUNNER_TEMP/changes.z")" || scope=full
            fi
            # File names are untrusted text: escape control characters and indent every line so none can start a workflow command.
            echo "Changed paths:"; tr '\0' '\n' < "$RUNNER_TEMP/changes.z" | cat -v | sed 's/^/  /'
          fi
          case "$scope" in docs|dashboards|full) ;; *) scope=full ;; esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "CI scope: $scope (event: $EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"

  # Unit tests, and in the full scope the lint checks (ruff, mypy, shell syntax), which used to be a separate `lint` job (issue 340).
  # Every check step runs even when an earlier one failed (`!cancelled()`), so one run still reports every failing check by name.
  unit-tests:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            collector/requirements*.txt
            ops/watchdog/requirements.txt
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          if [ -f collector/requirements-dev.txt ]; then pip install -r collector/requirements-dev.txt; fi
          pip install pytest pyyaml==6.0.2
      - name: Install lint tools
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}" types-PyYAML==6.0.12.20260906
      - name: ruff (collector)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: cd collector && ruff check .
      - name: mypy (collector)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: cd collector && mypy src
      - name: ruff (ops python)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: ruff check --config ops/ruff.toml ops
      - name: mypy (ops python)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: >
          mypy --strict --ignore-missing-imports
          ops/watchdog/watchdog.py ops/watchdog/integrity.py ops/watchdog/messages.py ops/check_config_drift.py ops/check_size_budget.py
          ops/check_panels.py ops/grafana_public.py ops/grafana_api.py ops/env_file.py ops/ci_scope.py ops/check_skips.py
      - name: shell syntax (ops scripts)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: |
          for f in ops/*.sh ops/migrate/*.sh; do [ "$f" = ops/deploy.sh ] || [ "$f" = ops/stale_issues.sh ] || sh -n "$f"; done
          for f in ops/backup/*.sh ops/deploy.sh ops/stale_issues.sh; do bash -n "$f"; done

      - name: pytest (unit; integration tests need Postgres and are marked)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        env:
          PYTHONPATH: collector/src
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/unit.xml
        run: pytest -q -m "not integration" tests collector/tests --ignore=tests/.venv
      # Issue 343: a skipped test is a test that did not run. The expected number is kept in one place, ops/check_skips.py
      # (23 here: the watchdog auto-restart tests switched off on purpose, issue 232). A new skip, or one switched back on,
      # fails this step until the number is changed in a reviewed diff.
      - name: unit skips (the number of skipped tests is the expected one)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: python ops/check_skips.py "$RUNNER_TEMP/unit.xml"
      # Dashboards scope: the same command on the dashboard test files only (the list lives in ops/ci_scope.py, and
      # tests/test_ci_scope.py fails if a test that reads the dashboards is missing from it). Nothing is deselected.
      - name: pytest (unit, dashboards scope)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'dashboards' }}
        env:
          PYTHONPATH: collector/src
        run: |
          read -r -a targets <<< "$(python ops/ci_scope.py tests unit)"
          [ "${#targets[@]}" -gt 0 ]   # an empty list would run more than intended; stop instead
          pytest -q -m "not integration" "${targets[@]}"

  integration-tests:
    needs: scope
    if: needs.scope.outputs.scope != 'docs'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-superuser-pw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: collector/requirements*.txt
      # The database is built by the SAME image production uses (ops/migrate: dbmate with --no-dump-schema, then db/roles.sql
      # in one transaction, then the watchdog_ro block), not by piping the migration files through psql (issue 96). That also
      # creates schema_migrations, so dbmate-only behaviour (per-migration transactions, the up/down split, the version table)
      # is exercised by CI. It runs on the host network, with the name `db` pointing at the service container, because
      # migrate.sh connects to host `db`. The passwords are test-only values for this throwaway service container.
      - name: Create database, apply migrations and roles (production migrate image)
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-pw
          POSTGRES_DB: vatpac_test
          GRAFANA_RO_PASSWORD: ci-grafana-ro-pw
          COLLECTOR_DB_PASSWORD: ci-collector-pw
          BACKUP_DB_PASSWORD: ci-backup-pw
          WATCHDOG_DB_PASSWORD: ci-watchdog-pw
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE vatpac_test"
          docker build -q -t vatpac-migrate-ci -f ops/migrate/Dockerfile .
          docker run --rm --network host --add-host db:127.0.0.1 \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e GRAFANA_RO_PASSWORD -e COLLECTOR_DB_PASSWORD -e BACKUP_DB_PASSWORD -e WATCHDOG_DB_PASSWORD \
            -v "$PWD/db:/db:ro" vatpac-migrate-ci
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          pip install pytest pytest-asyncio
      # VATPAC_TEST_STRICT=1: a missing database or ANY skipped test fails the run (tests/integration/conftest.py), so a
      # green result cannot hide tests that did not run. One pass only, in UTC (owner decision 11-11-2026, issue 339: the
      # system, the database sessions and every dashboard are UTC). The test connection's session time zone is set to UTC
      # explicitly in the DSN, so the run does not depend on the runner's zone, and VATPAC_TEST_EXPECT_TZ makes
      # tests/integration/test_time_zones.py fail if that option were silently ignored. Individual tests that move their own
      # session to another zone (test_time_zones.py and others) still do so; grafana_ro is pinned to UTC in db/roles.sql
      # (tests/integration/test_roles.py::test_grafana_ro_timezone_is_pinned_to_utc).
      - name: pytest (integration, UTC)
        if: needs.scope.outputs.scope == 'full'
        env:
          PYTHONPATH: collector/src
          VATPAC_TEST_STRICT: "1"
          VATPAC_TEST_EXPECT_TZ: UTC
          VATPAC_TEST_DSN: postgresql://postgres:ci-superuser-pw@localhost:5432/vatpac_test?options=-c%20TimeZone%3DUTC
          VATPAC_TEST_GRAFANA_RO_DSN: postgresql://grafana_ro:ci-grafana-ro-pw@localhost:5432/vatpac_test
        run: pytest tests/integration -m integration -q
      # Dashboards scope: the integration tests that run dashboard SQL against the views, on the same database, built the same
      # way, in strict mode and in UTC. Collector, migration and role tests are not run here.
      - name: pytest (integration, dashboards scope, UTC)
        if: needs.scope.outputs.scope == 'dashboards'
        env:
          PYTHONPATH: collector/src
          VATPAC_TEST_STRICT: "1"
          VATPAC_TEST_EXPECT_TZ: UTC
          VATPAC_TEST_DSN: postgresql://postgres:ci-superuser-pw@localhost:5432/vatpac_test?options=-c%20TimeZone%3DUTC
          VATPAC_TEST_GRAFANA_RO_DSN: postgresql://grafana_ro:ci-grafana-ro-pw@localhost:5432/vatpac_test
        run: |
          read -r -a targets <<< "$(python ops/ci_scope.py tests integration)"
          [ "${#targets[@]}" -gt 0 ]   # an empty list would run more than intended; stop instead
          pytest "${targets[@]}" -m integration -q

  # The small checks, one job of named steps (issue 340; each used to be its own job, and each job is billed in whole minutes).
  # Every step runs even when an earlier one failed (`!cancelled()`), so one run reports every failing check by its own step.
  # The secret scan and the attribution check run in every scope, and even when the scope job failed (the job has no condition
  # on the scope, only on cancellation); the other steps run only in the scopes that need them (ops/ci_scope.py;
  # tests/test_ci_scope.py runs these conditions for every scope).
  quick-checks:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: secret-scan (gitleaks)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Working agreement section 10 (10-11-2026): no commit message or pull request text may carry a Claude attribution. Runs in
      # every scope. It scans all history reachable from the checkout, so an old branch merged in with a trailer is caught too.
      - name: commit-attribution (no Claude attribution in commits or pull request text)
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 ops/check_no_claude_attribution.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        with:
          python-version: "3.14"
      - name: Install
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        run: pip install pyyaml==6.0.2 sqlglot==30.31.0 actionlint-py==1.7.12.25
      - name: config-drift (collector settings vs compose vs .env.example)
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        run: python ops/check_config_drift.py
      # sqlglot is installed (issue 343), so every dashboard query is parsed as PostgreSQL; the second line fails the step if
      # the validator ever goes back to "sql parsing: skipped".
      - name: dashboards (validator, with SQL parsing)
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        run: |
          python grafana/validate_dashboards.py | tee "$RUNNER_TEMP/dashboards.txt"
          grep -q '^sql statements parsed with sqlglot' "$RUNNER_TEMP/dashboards.txt"
      - name: dashboards (navigation check)
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        run: python ops/dashboard_nav.py --check
      - name: size-budget
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        run: python ops/check_size_budget.py
      # Issue 343: workflow syntax and expression errors. Shellcheck of the run scripts is off (-shellcheck=): it was not
      # measured on these scripts, so it is a separate decision.
      - name: actionlint (workflow files)
        if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs' }}
        run: actionlint -shellcheck= .github/workflows/*.yml
      - name: compose-config (compose files with a generated throwaway env)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        # .env.example has blank secrets by design, so compose would fail on it
        run: |
          sh ops/gen_env.sh "$RUNNER_TEMP/ci.env"
          sh ops/check_env.sh "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: compose-config (image names resolve in local and registry mode, issue 173)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        # The four built services must resolve to vatpac-stats-<name>:latest with both variables unset, to
        # <prefix>vatpac-stats-<name>:latest with the prefix alone, and to <prefix>...:<tag> with a tag override (the names the release workflow publishes).
        # It reads the env file the previous step generated.
        run: |
          want="collector watchdog backup migrate"
          got="$(env -u VATPAC_IMAGE_PREFIX -u VATPAC_IMAGE_TAG docker compose --env-file "$RUNNER_TEMP/ci.env" config --images | grep 'vatpac-stats-' | sort)"
          exp="$(for n in $want; do echo "vatpac-stats-$n:latest"; done | sort)"
          [ "$got" = "$exp" ] || { echo "local mode images differ"; echo "$got"; exit 1; }
          got="$(env -u VATPAC_IMAGE_TAG VATPAC_IMAGE_PREFIX=ghcr.io/t288matt/ docker compose --env-file "$RUNNER_TEMP/ci.env" config --images | grep 'vatpac-stats-' | sort)"
          exp="$(for n in $want; do echo "ghcr.io/t288matt/vatpac-stats-$n:latest"; done | sort)"
          [ "$got" = "$exp" ] || { echo "registry default images differ"; echo "$got"; exit 1; }
          got="$(VATPAC_IMAGE_PREFIX=ghcr.io/t288matt/ VATPAC_IMAGE_TAG=sha-abc1234 docker compose --env-file "$RUNNER_TEMP/ci.env" config --images | grep 'vatpac-stats-' | sort)"
          exp="$(for n in $want; do echo "ghcr.io/t288matt/vatpac-stats-$n:sha-abc1234"; done | sort)"
          [ "$got" = "$exp" ] || { echo "registry mode images differ"; echo "$got"; exit 1; }
      - name: compose-config (blank secrets must fail, H4 guard)
        if: ${{ !cancelled() && needs.scope.outputs.scope == 'full' }}
        run: |
          if docker compose --env-file .env.example config -q 2>/dev/null; then
            echo ".env.example boots with blank secrets"; exit 1
          fi

  image-build:
    runs-on: ubuntu-latest
    needs: [scope, quick-checks]
    if: needs.scope.outputs.scope == 'full'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all images (no push)
        run: |
          sh ops/gen_env.sh "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" build

  # The one check to require in branch protection. It always runs (even when a job above failed, was cancelled or was skipped),
  # and it fails unless every job the scope needs succeeded; a job may be skipped only when the scope says it is not needed
  # (ops/ci_scope.py verify, tested in tests/test_ci_scope.py). A skipped job is never read as a pass.
  ci-result:
    needs: [scope, unit-tests, integration-tests, quick-checks, image-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job the scope needs must have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 ops/ci_scope.py verify
