name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:  # release.yml runs this workflow and only publishes images if it passes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a run on main

env:
  RUFF_VERSION: "0.8.4"
  MYPY_VERSION: "1.14.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            collector/requirements*.txt
            ops/watchdog/requirements.txt
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          if [ -f collector/requirements-dev.txt ]; then pip install -r collector/requirements-dev.txt; fi
          pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}" pyyaml==6.0.2 types-PyYAML==6.0.12.20260906
      - name: ruff (collector)
        run: cd collector && ruff check .
      - name: mypy (collector)
        run: cd collector && mypy src
      - name: ruff (ops python)
        run: ruff check --config ops/ruff.toml ops
      - name: mypy (ops python)
        run: >
          mypy --strict --ignore-missing-imports
          ops/watchdog/watchdog.py ops/check_config_drift.py ops/check_size_budget.py
          ops/check_fixture_pii.py ops/check_panels.py
      - name: shell syntax (ops scripts)
        run: |
          for f in ops/*.sh ops/migrate/*.sh; do sh -n "$f"; done
          for f in ops/backup/*.sh; do bash -n "$f"; done

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements*.txt
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          if [ -f collector/requirements-dev.txt ]; then pip install -r collector/requirements-dev.txt; fi
          pip install pytest
      - name: pytest (unit; integration tests need Postgres and are marked)
        env:
          PYTHONPATH: collector/src
        run: pytest -q -m "not integration" tests collector/tests --ignore=tests/.venv

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: ci-superuser-pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-superuser-pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements*.txt
      - name: Create database, apply migrations and roles
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE vatpac_test"
          for f in db/migrations/*.sql; do
            echo "applying $f"
            # keep only the "migrate:up" half, as dbmate does
            sed '/^-- migrate:down/,$d' "$f" | psql -X -q -v ON_ERROR_STOP=1 -d vatpac_test
          done
          # test-only passwords for a throwaway service container
          psql -X -q -v ON_ERROR_STOP=1 -d vatpac_test \
            -v grafana_ro_password=ci-grafana-ro-pw \
            -v collector_password=ci-collector-pw \
            -v backup_password=ci-backup-pw \
            -f db/roles.sql
      - name: Install
        run: |
          pip install -r collector/requirements.txt
          pip install pytest pytest-asyncio
      - name: pytest (integration)
        env:
          PYTHONPATH: collector/src
          VATPAC_TEST_DSN: postgresql://postgres:ci-superuser-pw@localhost:5432/vatpac_test
          VATPAC_TEST_GRAFANA_RO_DSN: postgresql://grafana_ro:ci-grafana-ro-pw@localhost:5432/vatpac_test
        run: pytest tests/integration -m integration -q

  config-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: collector settings vs compose vs .env.example
        run: python ops/check_config_drift.py

  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python grafana/validate_dashboards.py

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate compose files with a generated throwaway env
        # .env.example has blank secrets by design, so compose would fail on it
        run: |
          sh ops/gen_env.sh "$RUNNER_TEMP/ci.env"
          sh ops/check_env.sh "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" config -q
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Blank secrets must fail (H4 guard)
        run: |
          if docker compose --env-file .env.example config -q 2>/dev/null; then
            echo ".env.example boots with blank secrets"; exit 1
          fi

  size-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python ops/check_size_budget.py

  fixture-pii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python ops/check_fixture_pii.py tests/fixtures

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-build:
    runs-on: ubuntu-latest
    needs: [compose-config]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build all images (no push)
        run: |
          sh ops/gen_env.sh "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" build
