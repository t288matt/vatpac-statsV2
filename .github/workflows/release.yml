name: release

# On a stable semver tag (vMAJOR.MINOR.PATCH only; pre-release tags such as v1.2.3-rc1 do not match
# the filter, so they never publish and never move `latest`): run the full CI workflow for the
# same commit, then build and push images to GHCR using the built-in GITHUB_TOKEN.
# Third-party actions are referenced by tag. TODO pin each to a full commit SHA (see ci.yml).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: ci   # only runs when every CI job passed for this commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            context: .
            file: collector/Dockerfile
          - name: watchdog
            context: ops/watchdog
            file: ops/watchdog/Dockerfile
          - name: backup
            context: ops/backup
            file: ops/backup/Dockerfile
          - name: migrate
            context: ops/migrate
            file: ops/migrate/Dockerfile
    steps:
      - uses: actions/checkout@v4 # TODO pin to SHA
      - uses: docker/setup-buildx-action@v3 # TODO pin to SHA
      - uses: docker/login-action@v3 # TODO pin to SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5 # TODO pin to SHA
        with:
          images: ghcr.io/t288matt/vatpac-stats-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6 # TODO pin to SHA
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
