name: release

# Manual publish of commit-tagged images to GHCR (issue 173, P1). Run it from the Actions tab (or `gh workflow run release.yml
# -f commit=<sha>`) with a commit that is on main and whose CI run on main already passed. It does NOT re-run CI: it checks
# that run, then only builds and pushes. Images are tagged `sha-<first 7 characters>` and carry the full SHA in the
# org.opencontainers.image.revision label. There is no `latest` and no semver tag. New packages in a private repository
# are private by default; do not make them public.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit on main to publish (full or short SHA). Its CI run on main must have succeeded."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.commit }}
        run: |
          set -eu
          case "$INPUT" in *[!0-9a-fA-F]*|"") echo "::error::commit must be a hex SHA, got '$INPUT'"; exit 1;; esac
          [ "${#INPUT}" -ge 7 ] || { echo "::error::commit must be at least 7 characters"; exit 1; }
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT" --jq .sha)"
          # compare/<sha>...main: `ahead` (main is ahead of the commit) or `identical` means the commit is on main; `diverged` or `behind` means it is not
          rel="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)"
          case "$rel" in ahead|identical) ;; *) echo "::error::$sha is not on main (compare status: $rel)"; exit 1;; esac
          ok="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --branch main --event push \
                  --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful ci run on main for $sha. Wait for it, or pick a commit whose CI ran (a docs-only commit skips CI)."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "publishing $sha as sha-${sha:0:7}; ci on main passed"

  images:
    needs: check   # build and push only; CI is not repeated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            context: .
            file: collector/Dockerfile
          - name: watchdog
            context: ops   # the image also carries ops/audit/independent.py and invariants.sql
            file: ops/watchdog/Dockerfile
          - name: backup
            context: ops/backup
            file: ops/backup/Dockerfile
          - name: migrate
            context: .   # db/ is baked into the image (ops/migrate/Dockerfile.dockerignore limits the context)
            file: ops/migrate/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/t288matt/vatpac-stats-${{ matrix.name }}
          tags: |
            type=raw,value=sha-${{ needs.check.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=sha-${{ needs.check.outputs.short }}
