name: release

# Publish of commit-tagged images to GHCR (issue 173, P1; automatic after green CI on main since issue 268).
# AUTOMATIC: when the `ci` workflow finishes successfully for a push to main, this workflow publishes that commit, but only if it is
# still main's tip. If a newer commit has landed, the run publishes nothing (green, with a notice) and the newer commit's own CI
# run publishes instead, so `latest` never moves backwards when two CI runs finish out of order. Nothing deploys: the owner still
# runs `make deploy` on the VM by hand. A commit that skips CI (docs only) is not published automatically.
# MANUAL (still available, e.g. for a rollback): run it from the Actions tab (or `gh workflow run release.yml`)
# with a commit that is on main and whose CI run on main already passed. Leave `commit` blank to publish whatever main's tip is
# at the moment the job runs (resolved inside the job, not when you click, so a push to main after you click but before the job
# starts is still picked up) or give a specific commit (full or short SHA) to publish an older one, e.g. for a rollback. It does
# NOT re-run CI: it checks that run, then only builds and pushes. Images are tagged `sha-<first 7 characters>` (kept for history
# and rollback) and carry the full SHA in the org.opencontainers.image.revision label. A final job then moves the tag `latest` to
# those same images, but only after all four are pushed, so latest never mixes two commits. The VM's .env names latest once and
# is never edited per deploy (ADR-031, amended 15-10-2026). There is no semver tag. New packages in a private repository
# are private by default; do not make them public.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit on main to publish (full or short SHA). Leave blank to publish main's current tip. Its CI run on main must have succeeded."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # A manual run always goes ahead. An automatic run goes ahead only after a successful ci run for a push (a failed or cancelled
    # ci run, or one for a pull request, publishes nothing).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT: ${{ inputs.commit }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_run" ]; then
            sha="$AUTO_SHA"
            tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$sha" != "$tip" ]; then
              echo "::notice::$sha is no longer main's tip ($tip), so nothing is published here; the newer commit's own release publishes instead and latest never moves backwards"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "automatic release: ci passed on main for the tip, $sha"
          elif [ -z "$INPUT" ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            echo "no commit given: publishing main's current tip, $sha"
          else
            case "$INPUT" in *[!0-9a-fA-F]*) echo "::error::commit must be a hex SHA, got '$INPUT'"; exit 1;; esac
            [ "${#INPUT}" -ge 7 ] || { echo "::error::commit must be at least 7 characters"; exit 1; }
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT" --jq .sha)"
          fi
          # compare/<sha>...main: `ahead` (main is ahead of the commit) or `identical` means the commit is on main; `diverged` or `behind` means it is not
          rel="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)"
          case "$rel" in ahead|identical) ;; *) echo "::error::$sha is not on main (compare status: $rel)"; exit 1;; esac
          ok="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --branch main --event push \
                  --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful ci run on main for $sha. Wait for it, or pick a commit whose CI ran (a docs-only commit skips CI)."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "publishing $sha as sha-${sha:0:7}; ci on main passed"

  images:
    needs: check   # build and push only; CI is not repeated
    if: needs.check.outputs.publish == 'true'   # an automatic run for a commit that is no longer main's tip stops at check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: collector
            context: .
            file: collector/Dockerfile
          - name: watchdog
            context: ops   # the image also carries ops/audit/independent.py, invariants.sql and identity_flap.sql
            file: ops/watchdog/Dockerfile
          - name: backup
            context: ops/backup
            file: ops/backup/Dockerfile
          - name: migrate
            context: .   # db/ is baked into the image (ops/migrate/Dockerfile.dockerignore limits the context)
            file: ops/migrate/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/t288matt/vatpac-stats-${{ matrix.name }}
          tags: |
            type=raw,value=sha-${{ needs.check.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=sha-${{ needs.check.outputs.short }}

  promote:
    # Moves `latest` to the four sha-<7> images just pushed (a re-tag of the same image, no rebuild). Runs only when every image job
    # succeeded, so a failed build leaves latest where it was.
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SHORT: ${{ needs.check.outputs.short }}
        run: |
          set -eu
          for n in collector watchdog backup migrate; do
            img="ghcr.io/t288matt/vatpac-stats-$n"
            docker buildx imagetools create --tag "$img:latest" "$img:sha-$SHORT"
            echo "latest -> sha-$SHORT for $n"
          done
