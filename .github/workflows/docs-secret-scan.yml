name: docs-secret-scan

# A push to main or dev that only changes prose skips ci.yml (to save Actions minutes). This one-job workflow keeps the secret
# scan on exactly those pushes. Pull requests are not handled here since issue 290: ci.yml runs on every pull request, and its
# secret-scan step (in its quick-checks job) runs in every scope (docs, dashboards and full) and is part of the ci-result check.
on:
  push:
    branches: [main, dev]
    paths:
      - '*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: docs-secret-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
