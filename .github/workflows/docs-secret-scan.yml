name: docs-secret-scan

# ci.yml skips runs that only change prose (to save Actions minutes). This one-job workflow keeps the secret scan on
# exactly those changes. When a change touches anything else, ci.yml runs its own secret-scan job and this one is skipped.
on:
  push:
    branches: [main, dev]
    paths:
      - '*.md'
      - 'docs/**'
  pull_request:
    paths:
      - '*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: docs-secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
