# Keeps third-party GitHub Actions and base images current. The workflow actions are pinned to full
# commit SHAs with a tag comment (T10); Dependabot updates both the SHA and the tag comment.
# Major version bumps are ignored for postgres (a Postgres major upgrade cannot open the existing 16 data
# directory and needs a dump/restore plan), grafana/grafana-oss and amacneil/dbmate; patch and minor updates
# still arrive. Owner decision 08-10-2026.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ops/backup
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/migrate
    schedule:
      interval: weekly
    ignore:
      - dependency-name: amacneil/dbmate
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/watchdog
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
    ignore:
      # numpy 2.x needs the x86-64-v2 CPU baseline, which the VM's virtual CPU lacks: the collector
      # crash-looped on import (07-10-2026, pinned in d5de461). CI cannot catch it (modern runners).
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /ops/watchdog
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: grafana/grafana-oss
        update-types: ["version-update:semver-major"]
      - dependency-name: amacneil/dbmate
        update-types: ["version-update:semver-major"]
