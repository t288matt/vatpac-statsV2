# Keeps third-party GitHub Actions and base images current. The workflow actions are pinned to full
# commit SHAs with a tag comment (T10); Dependabot updates both the SHA and the tag comment.
# Major version bumps are ignored for postgres (a Postgres major upgrade cannot open the existing 16 data
# directory and needs a dump/restore plan), grafana/grafana (the OSS edition image) and amacneil/dbmate; patch and minor updates
# still arrive. Owner decision 08-10-2026.
# Python stays on 3.12 for the collector and the watchdog (owner decision 15-10-2026): minor and major Python base image
# bumps are ignored; patch updates still arrive. Revisit by deleting the two python ignore blocks below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/backup
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/migrate
    schedule:
      interval: weekly
    ignore:
      - dependency-name: amacneil/dbmate
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/watchdog
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
    # numpy is no longer ignored (14-10-2026). It needs the x86-64-v2 CPU baseline, so the VM's Proxmox CPU type must be
    # 'host' or 'x86-64-v2-AES' (the default kvm64 crash-looped the collector on 07-10-2026). CI cannot catch it (modern runners).
  - package-ecosystem: pip
    directory: /ops/watchdog
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: grafana/grafana
        update-types: ["version-update:semver-major"]
      - dependency-name: amacneil/dbmate
        update-types: ["version-update:semver-major"]
