# Keeps GitHub Actions, Python packages and the Python base images current. The workflow actions are pinned to full
# commit SHAs with a tag comment (T10); Dependabot updates both the SHA and the tag comment.
# Third-party images (postgres, grafana/grafana, amacneil/dbmate) use floating major tags (ADR-032, issue 176), so
# small updates arrive with `docker compose pull` and Dependabot has nothing to bump. The docker and docker-compose
# entries for them are kept only to refuse a major jump (Postgres 17 cannot open the version 16 data directory;
# a Grafana major migrates its data one way): a major is a deliberate edit, never an automatic pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      docker-collector:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /ops/backup
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      docker-ops-backup:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/migrate
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      docker-ops-migrate:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: amacneil/dbmate
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /ops/watchdog
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      docker-ops-watchdog:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      pip-collector:
        applies-to: version-updates
        patterns:
          - "*"
    # numpy is no longer ignored (14-10-2026). It needs the x86-64-v2 CPU baseline, so the VM's Proxmox CPU type must be
    # 'host' or 'x86-64-v2-AES' (the default kvm64 crash-looped the collector on 07-10-2026). CI cannot catch it (modern runners).
  - package-ecosystem: pip
    directory: /ops/watchdog
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      pip-ops-watchdog:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # one pull request for all version updates of this entry; security updates are not grouped and stay separate
    groups:
      docker-compose:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: grafana/grafana
        update-types: ["version-update:semver-major"]
      - dependency-name: amacneil/dbmate
        update-types: ["version-update:semver-major"]
