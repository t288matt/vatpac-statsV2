# Keeps third-party GitHub Actions and base images current. The workflow actions are pinned to full
# commit SHAs with a tag comment (T10); Dependabot updates both the SHA and the tag comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ops/backup
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ops/migrate
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ops/watchdog
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /ops/watchdog
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
