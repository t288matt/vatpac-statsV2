[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vatpac-collector"
version = "0.1.0"
description = "VATSIM feed collector for VATPAC stats"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "shapely>=2.0",
    "pydantic-settings>=2.2",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/vatpac"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shapely.*", "psycopg_pool.*"]
ignore_missing_imports = true
