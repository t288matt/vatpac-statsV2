# systemd drop-in for systemd-networkd-wait-online.service on the production VM (issue 164).
# Install as: /etc/systemd/system/systemd-networkd-wait-online.service.d/20-wait-for-ipv4.conf
# Steps and checks: docs/RUNBOOKS/vm-boot-network.md
#
# THE PROBLEM
#   Grafana publishes its port on the VM's LAN address only (192.168.1.222:3300, ADR-029). That address comes from DHCP.
#   On 14-10-2026 the VM rebooted, docker.service started at 08:59:11 UTC, "network-online.target" had already been
#   reached at 08:59:10, but the IPv4 address only arrived at 09:00:09 (59 s later). Docker could not bind the port,
#   did not retry, and Grafana (and the public dashboards) stayed down for about 8 hours.
#
# WHY ORDERING WAS NOT ENOUGH
#   docker.service already waits for network-online.target. That target is reached when
#   systemd-networkd-wait-online finishes. Netplan writes its own drop-in for that service
#   (/run/systemd/system/systemd-networkd-wait-online.service.d/10-netplan.conf, regenerated on every boot) which
#   only asks for "ens18 degraded" and then "ens18 routable". The router also hands out IPv6 addresses (SLAAC) within
#   seconds, so ens18 counts as "routable" on IPv6 alone, before DHCP has given the IPv4 address.
#
# WHAT THIS DOES
#   Adds ONE more check after netplan's two: wait until ens18 has an IPv4 address. Docker therefore starts only after the
#   address Grafana binds to exists.
#   - There is deliberately NO empty "ExecStart=" line: that would delete netplan's checks. We add to them.
#   - The file name sorts after 10-netplan.conf, so our check runs last. The unit is Type=oneshot, which runs each
#     ExecStart line in order.
#   - --timeout=120: if DHCP never answers (router down) boot continues after two minutes instead of hanging for ever.
#     Grafana would then still fail to bind, and the bring-back step in the runbook applies.
#   - /usr/lib/systemd/... is the real path; /lib is a symlink to it on Ubuntu, netplan uses /lib. Either works.
[Service]
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=ens18 --ipv4 --timeout=120
