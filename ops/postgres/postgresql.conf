# VATPAC Stats: PostgreSQL 16 tuning for a small box (about 4 GB RAM, SSD).
# Loaded with -c config_file=..., so every setting the container needs is stated here.

listen_addresses = '*'
max_connections = 50

# Memory
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB
huge_pages = off

# WAL and checkpoints
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 2GB

# Planner (SSD assumed; raise random_page_cost to 4 on spinning disks)
random_page_cost = 1.1
effective_io_concurrency = 200

# Housekeeping
autovacuum_naptime = 30s
idle_in_transaction_session_timeout = 60s

# Time
timezone = 'UTC'
log_timezone = 'UTC'

# Logging to stdout (captured by Docker json-file rotation)
logging_collector = off
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '
