# VATPAC Stats v3 stack. SPEC.md section 9 is authoritative.
# Secrets come only from .env (git-ignored). Generate it with `sh ops/gen_env.sh`; the secret
# values in .env.example are blank on purpose, so compose fails until they are set.
# Image policy (ADR-032): third-party images use the most floating tag their registry actually publishes, never
# `latest` and never an exact patch: a floating MAJOR tag where one exists (postgres:16-bookworm, amacneil/dbmate:2),
# else the closest thing to it (grafana/grafana has no bare-major tag, only MAJOR.MINOR, so grafana:12.4). Patch
# (and, for Grafana, minor) updates arrive with each `docker compose pull`; a new major version is a deliberate
# change made by editing the tag. The db and backup images must stay on the same Postgres major (pg_dump version).
name: vatpac

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    shm_size: 256mb
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vatpac}
      POSTGRES_USER: ${POSTGRES_USER:-vatpac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [vatpac]

  migrate:
    build:
      context: .
      dockerfile: ops/migrate/Dockerfile
    image: ${VATPAC_IMAGE_PREFIX:-}vatpac-stats-migrate:${VATPAC_IMAGE_TAG:-latest}
    restart: "no"
    logging: *logging
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vatpac}
      POSTGRES_USER: ${POSTGRES_USER:-vatpac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:?set GRAFANA_RO_PASSWORD in .env}
      WATCHDOG_DB_PASSWORD: ${WATCHDOG_DB_PASSWORD:?set WATCHDOG_DB_PASSWORD in .env}
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD:?set COLLECTOR_DB_PASSWORD in .env}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD in .env}
      STATS_LOADER_DB_PASSWORD: ${STATS_LOADER_DB_PASSWORD:?set STATS_LOADER_DB_PASSWORD in .env}
    # No volumes: the migrations and db/roles.sql are in the image (ops/migrate/Dockerfile), the same carrier as the code in the other
    # images. After editing a migration in a checkout, run `docker compose build migrate` (local build mode) before `up`.
    networks: [vatpac]

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
      args:
        VERSION: ${VATPAC_VERSION:-dev}
    image: ${VATPAC_IMAGE_PREFIX:-}vatpac-stats-collector:${VATPAC_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # least-privilege role `collector` (created by the migrate job), not the owner/superuser
      DATABASE_URL: postgresql://collector:${COLLECTOR_DB_PASSWORD:?set COLLECTOR_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vatpac}
      VATSIM_FEED_URL: ${VATSIM_FEED_URL:-https://data.vatsim.net/v3/vatsim-data.json}
      VATSIM_STATUS_URL: ${VATSIM_STATUS_URL:-https://status.vatsim.net/status.json}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      TEXT_MAX_LENGTH: ${TEXT_MAX_LENGTH:-2000}
      FEED_MAX_FUTURE_SECONDS: ${FEED_MAX_FUTURE_SECONDS:-120}
      POSITION_RETENTION_DAYS: 180
      AIRBORNE_GAP_CAP_SECONDS: ${AIRBORNE_GAP_CAP_SECONDS:-}
      HOME_ICAO_PREFIXES: ${HOME_ICAO_PREFIXES:-Y}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      CIRCUIT_FAILURE_THRESHOLD: ${CIRCUIT_FAILURE_THRESHOLD:-5}
      CIRCUIT_SLOW_INTERVAL_SECONDS: ${CIRCUIT_SLOW_INTERVAL_SECONDS:-60}
      ARCHIVE_ENABLED: ${ARCHIVE_ENABLED:-true}
      ARCHIVE_DIR: ${ARCHIVE_DIR:-/archive}
      ARCHIVE_COMPACT_EVERY_S: ${ARCHIVE_COMPACT_EVERY_S:-300}
      ARCHIVE_FULL_EVERY_S: ${ARCHIVE_FULL_EVERY_S:-3600}
      ARCHIVE_COMPACT_KEEP_DAYS: 30
      ARCHIVE_FULL_KEEP_DAYS: 7
      ARCHIVE_ANOMALY_KEEP_DAYS: 90
      ARCHIVE_MAX_MB: 1024
      ARCHIVE_GAP_S: ${ARCHIVE_GAP_S:-}
    volumes:
      - ./config:/app/config:ro
      # the root filesystem is read-only; the raw-feed archive needs a writable volume (owned by uid 10001, see the Dockerfile)
      - archive:/archive
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('HEALTH_PORT','8080'), timeout=4)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    networks: [vatpac]

  vatsim-atc-stats:
    # The ATC stats loader (issue 387): loads every VATSIM ATC session, one UTC day at a time, into atc_stats_session. It reads
    # the public VATSIM API (one request at a time, `STATS_MIN_INTERVAL_SECONDS` apart) and writes the database as the role `stats_loader`; no published port.
    build:
      context: ./stats_loader
      args:
        VERSION: ${VATPAC_VERSION:-dev}
    image: ${VATPAC_IMAGE_PREFIX:-}vatpac-stats-loader:${VATPAC_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # A request in flight can last 30 seconds and Docker waits only 10 by default: a deploy would kill the loader mid-request and
    # leave a run marked interrupted (a false alert) instead of stopped.
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # least-privilege role `stats_loader` (created by the migrate job), not the owner/superuser
      DATABASE_URL: postgresql://stats_loader:${STATS_LOADER_DB_PASSWORD:?set STATS_LOADER_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vatpac}
      # when the daily run makes its requests, UTC (HH:MM)
      STATS_RUN_AT: 06:00
      # seconds between two requests to the VATSIM API; the loader never goes below 5
      STATS_MIN_INTERVAL_SECONDS: 45
      STATS_PAGE_SIZE: 5000
      # days before the newest stored date that every run loads again (sessions that closed late)
      STATS_OVERLAP_DAYS: ${STATS_OVERLAP_DAYS:-2}
      # Retention must be a plain number in the compose file (ops/check_config_drift.py rejects ${...} for retention periods).
      STATS_RETENTION_YEARS: 10
    healthcheck:
      # healthy = a run finished successfully in the last 36 hours, or a run in progress wrote a day in that time. The first
      # run has the most to load and can take days, so the first day it writes is what turns it healthy; the long start period
      # covers that wait.
      test: ["CMD", "python", "-m", "vatsim_stats.app", "health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30m
    networks: [vatpac]

  grafana:
    image: grafana/grafana:12.4  # the OSS edition; the grafana-oss image stops at 11.6.5 (11.6.15, 03-06-2026, is only published as grafana/grafana). Docker Hub has no bare-major "12" tag for this image (confirmed 18-10-2026: "manifest unknown"), only MAJOR.MINOR and more specific, so this floats on minor instead of major
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # read_only + tmpfs is NOT enabled: Grafana writes plugins/logs/sessions under /var/lib/grafana
    # and /tmp, and this could not be validated offline. Revisit with a test deploy.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Only applied on first start (empty grafana_data). Rotate with `grafana cli admin reset-admin-password`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300/}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
      # UK-style dates on every axis, tooltip and picker: Grafana's defaults are US-style (MM/DD) and ISO-style (YYYY-MM-DD, YYYY-MM)
      GF_DATE_FORMATS_FULL_DATE: "DD-MM-YYYY HH:mm:ss"
      GF_DATE_FORMATS_INTERVAL_SECOND: "HH:mm:ss"
      GF_DATE_FORMATS_INTERVAL_MINUTE: "HH:mm"
      GF_DATE_FORMATS_INTERVAL_HOUR: "DD-MM HH:mm"
      GF_DATE_FORMATS_INTERVAL_DAY: "DD-MM"
      GF_DATE_FORMATS_INTERVAL_MONTH: "MM-YYYY"
      GF_DATE_FORMATS_INTERVAL_YEAR: "YYYY"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # false suits plain-http LAN access; set GRAFANA_COOKIE_SECURE=true behind TLS
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      # Referenced by the provisioned datasource as $${GRAFANA_RO_DB_PASSWORD}
      GRAFANA_RO_DB_PASSWORD: ${GRAFANA_RO_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vatpac}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # loopback by default; LAN access is opt-in via GRAFANA_BIND (LAN IP or 0.0.0.0)
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    networks: [vatpac]

  backup:
    build:
      context: ./ops/backup
      args:
        EXTRA_APT_PACKAGES: ${BACKUP_EXTRA_APT_PACKAGES:-}
    image: ${VATPAC_IMAGE_PREFIX:-}vatpac-stats-backup:${VATPAC_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      # pg_dump runs as the read-only role backup_ro (pg_read_all_data)
      PGUSER: backup_ro
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-vatpac}
      # restore.sh / restore-test.sh need CREATE/DROP/RENAME DATABASE, which backup_ro cannot do,
      # so they use the owner role (never used by the nightly dump)
      RESTORE_PGUSER: ${POSTGRES_USER:-vatpac}
      RESTORE_PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: 14
      BACKUP_TIME_UTC: ${BACKUP_TIME_UTC:-02:00}
      BACKUP_DUMP_TIMEOUT_S: ${BACKUP_DUMP_TIMEOUT_S:-1800}
      BACKUP_VALIDATE_TIMEOUT_S: ${BACKUP_VALIDATE_TIMEOUT_S:-300}
      BACKUP_MIN_SIZE_PERCENT: ${BACKUP_MIN_SIZE_PERCENT:-50}
      BACKUP_MIN_FIRST_BYTES: ${BACKUP_MIN_FIRST_BYTES:-1048576}
      BACKUP_MIN_KEEP: 3
      BACKUP_RESTORE_TEST_DAY: ${BACKUP_RESTORE_TEST_DAY:-7}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - backups:/backups
    healthcheck:
      # healthy = a dump younger than ~25 h exists, or the loop started less than 24 h ago
      # (the first nightly run has not happened yet)
      test:
        - CMD-SHELL
        - "find /backups -maxdepth 1 -name '*.dump' -mmin -1500 | grep -q . || find /backups/.loop_started -mmin -1440 2>/dev/null | grep -q ."
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 2m
    networks: [vatpac]

  watchdog:
    build:
      context: ./ops
      dockerfile: watchdog/Dockerfile
    image: ${VATPAC_IMAGE_PREFIX:-}vatpac-stats-watchdog:${VATPAC_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # No Docker access: the watchdog checks HTTP health and the database and
      # alerts only. Container restarts are handled outside this repo.
      DOCKER_HOST_URL: ""
      COMPOSE_PROJECT: vatpac
      COLLECTOR_HEALTH_URL: http://collector:${HEALTH_PORT:-8080}/health
      GRAFANA_HEALTH_URL: http://grafana:3000/api/health
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-vatpac}
      DB_USER: watchdog_ro
      DB_PASSWORD: ${WATCHDOG_DB_PASSWORD}
      BACKUP_DIR: /backups
      STATUS_FILE: /var/watchdog/watchdog_status.json
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      UPTIME_KUMA_PUSH_URL: ${UPTIME_KUMA_PUSH_URL:-}
      WATCHDOG_INTERVAL_SECONDS: 60
      WATCHDOG_WARN_SECONDS: 60
      WATCHDOG_PAGE_SECONDS: 300
      WATCHDOG_CONFIRM_CYCLES: 2
      WATCHDOG_DISK_PCT: 80
      WATCHDOG_DISK_PATHS: "/backups,/"
      WATCHDOG_DB_MAX_GB: 5
      WATCHDOG_BACKUP_MAX_HOURS: 26
      WATCHDOG_RESTORE_TEST_MAX_DAYS: 9
      # on/off flag for the backup_remote check: 1 when BACKUP_REMOTE is set, empty otherwise. The command itself is NOT passed.
      BACKUP_REMOTE_ENABLED: ${BACKUP_REMOTE:+1}
      # scheduled integrity checks (issue 20): the invariant sweep and the archive cross-check; 0 disables either
      WATCHDOG_INTEGRITY_INTERVAL_HOURS: 72
      WATCHDOG_CROSSCHECK_INTERVAL_DAYS: 14
      WATCHDOG_CROSSCHECK_SAMPLES: 24
      # alert for pilots who log on, file a plan and never get airborne (issue 331). Live by default (owner decision 21-11-2026): it sends the Telegram
      # messages. Set WATCHDOG_NEVER_FLEW_DRY_RUN=1 in .env for dry-run (log only, send nothing). A logon is remembered for the hours below after its alert.
      WATCHDOG_NEVER_FLEW_DRY_RUN: ${WATCHDOG_NEVER_FLEW_DRY_RUN:-0}
      WATCHDOG_NEVER_FLEW_REMEMBER_HOURS: 24
      ARCHIVE_DIR: /archive
      REFERENCE_CONFIG_DIR: /config
    volumes:
      - backups:/backups:ro
      # read-only views for the cross-check: the collector's raw-feed archive and the polygon and whitelist it filters with
      - archive:/archive:ro
      - ./config:/config:ro
      - watchdog_status:/var/watchdog
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time;sys.exit(0 if time.time()-os.path.getmtime('/var/watchdog/watchdog_status.json')<180 else 1)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks: [vatpac]

networks:
  vatpac:
    name: vatpac

volumes:
  pgdata:
  grafana_data:
  backups:
  watchdog_status:
  archive:
